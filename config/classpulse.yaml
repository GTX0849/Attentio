# Shared configuration for worker, backend and dashboard.
# Thresholds for the attention state rules are in the `states:` section.
worker:
  target_fps: 10        # frames processed per second
  window_seconds: 30    # length of one attention record window

backend:
  url: http://127.0.0.1:8000   # where the worker and dashboard reach the backend

dashboard:
  refresh_seconds: 10

# Sign-in (backend/auth.py). Accounts are made with python -m backend.accounts.
auth:
  session_hours: 12              # a sign-in stops working this long after it was made
  login_max_failures: 5          # failed sign-ins per username inside the window, then 429
  login_window_minutes: 5

# Attention state rules (worker/states.py). Angles are degrees relative to the
# student's calibration pose; positive pitch = looking down. The bands below are the
# camera's limits, used until enough is learned about the student (`learning:` below);
# they are measured from a reference direction that moves with the student.
states:
  pitch_attentive_min_deg: -30   # attentive pitch band: -30 (looking up) to +15; this is the default "up" extent
  pitch_attentive_max_deg: 15    # downward limits are fixed and never learned
  pitch_neutral_max_deg: 38      # neutral band: above +15 up to +38; beyond that (or above the up extent) is distracted
  yaw_max_deg: 35                # |yaw| above this is distracted; this is the default sideways extent
  eyes_closed_grace_s: 1.5       # closure shorter than this is ignored; from here on it is distracted
  look_down_allowance_s: 8       # seconds of looking down that stay neutral
  allowance_refill_s: 2          # continuous attentive seconds needed to refill the allowance
  # The front region, learned per student during the lecture (worker/front_region.py), only from
  # Attentive readings with a face. Discarded at session end and on recalibration.
  learning:
    window_s: 120                # reference direction = median of pitch and yaw over this many seconds
    max_samples: 2400            # bound on stored samples, whatever the reading rate
    max_gap_s: 2                 # a gap between two readings counts as at most this much data
    update_interval_s: 1         # the median and spread are recomputed at most this often
    min_attentive_s: 30          # seconds of Attentive data needed before anything is learned
    max_reference_pitch_deg: 15  # the reference never moves further than this from calibration (pitch)
    max_reference_yaw_deg: 20    # ... or this (yaw)
    spread_percentile: 90        # personal spread = this percentile of |angle - reference| while Attentive
    spread_multiplier: 2.5       # extent = clamp(this x spread, minimum, maximum)
    min_up_extent_deg: 15        # how far up (above the reference) still counts as Attentive
    max_up_extent_deg: 40
    min_side_extent_deg: 15      # how far to either side of the reference still counts as Attentive
    max_side_extent_deg: 45

# Student and teacher figures (backend/metrics.py).
scores:
  min_presence_ratio: 0.5        # presence below this over the period shown hides attention; a lecture counts as attended at or above it

# Teacher figures (backend/teacher_figures.py).
teachers:
  min_lectures: 5                # a teacher's figures stay hidden until they have this many lectures with records
  range_level: 0.95              # the range shown around each figure (0.95 is mean +/- 1.96 standard errors)

# Marks and student groups (backend/marks.py).
marks:
  attention_line: 0.60           # attention strictly above this is "attentive" in the four student groups

# Real readings from the webcam (worker/perception.py, worker/mediapipe_source.py).
perception:
  calibration_seconds: 3         # at launch (and on recalibrate) the person looks at the screen this long
  recalibrate_key: c             # press in the preview window to calibrate again
  face_model: models/face_landmarker.task          # paths are relative to the project root
  pose_model: models/pose_landmarker_lite.task     # fetch both with: python -m worker.models download
  blink_threshold: 0.5           # eyeBlinkLeft and eyeBlinkRight both at or above this = eyes closed
  shoulder_visibility_threshold: 0.5   # both shoulders' pose visibility at or above this = shoulders present
  invert_pitch: false            # flip if looking down shows as negative pitch in the preview
  invert_yaw: false              # flip the sign of yaw (it only matters for the absolute value, so rarely needed)
  max_faces: 5                   # most faces the face model looks for in a frame; only the locked (largest at calibration) one is scored
  max_poses: 5                   # most bodies the pose model looks for; shoulders come from the body inside the locked face's box
  face_lost_after_s: 1           # the locked face missing for longer than this counts as no face; it is never swapped for another

# Simulated classroom history (python -m simulator seed). Effects are in attention points
# (percentage points of attention, attentive / (attentive + distracted)).
simulator:
  weeks: 4                       # weeks of lectures, ending today
  seed: 20260401                 # same seed, same data
  students_per_section: 30       # two sections
  records_per_request: 3000      # records per POST /api/records
  sections: [SIM-A, SIM-B]       # the first is the more attentive one
  # The first teacher is the better one, the second teaches the better section in the morning,
  # the other three are neutral. The default timetable (simulator/timetable.py) is built around this.
  teachers:
    - Dr. Anita Menon
    - Prof. Rahul Bhat
    - Dr. Sandeep Kulkarni
    - Ms. Farah Siddiqui
    - Dr. Vikram Joshi
  subjects: [Algorithms, Databases, Operating Systems, Networks, Statistics]   # one per teacher
  effects:
    best_teacher_points: 6       # the first teacher, over the other four
    afternoon_slot_points: -12   # the 14:00 slot, over the morning slots
    better_section_points: 5     # the first section, over the second
  noise:
    window: 0.08                 # sd of attention in one 30-second window
    student_lecture: 0.04        # sd of a student's whole lecture (a good or bad day)
    lecture: 0.02                # sd shared by everyone in a lecture
    neutral_share: 0.10          # share of in-view time spent neutral (note taking)
  # Mix per section, personal baseline attention, chance of missing a whole lecture, and the
  # chance that a window is not visible. "struggling" students are attentive; the marks
  # simulator makes their marks low.
  archetypes:
    engaged:      {share: 0.34, baseline: 0.84, absent: 0.02, hidden: 0.01}
    average:      {share: 0.26, baseline: 0.70, absent: 0.05, hidden: 0.03}
    struggling:   {share: 0.17, baseline: 0.78, absent: 0.04, hidden: 0.02}
    disengaged:   {share: 0.23, baseline: 0.42, absent: 0.15, hidden: 0.08}
  # Marks (simulator/generate.py). Each subject is tested twice for every section and teacher
  # pairing, at the end of each half of the lecture days, and the marks are uploaded through the
  # marks endpoint (simulated). A mark is ability + personal offset + teacher points + test noise,
  # in percent of the maximum. A student whose mark would fall below skip_below stays away from the
  # test with probability skip_chance, which is how a better teacher gets more of the weaker
  # students to sit the test (the only thing percentiles within a test can show; see README).
  marks:
    tests_per_pairing: 2
    max_marks: [50, 100]         # out of; test 1 is out of 50, test 2 out of 100, then it repeats
    ability:                     # mean mark by archetype, percent of the maximum
      engaged: 82
      average: 62
      struggling: 38             # attentive, but low marks
      disengaged: 30
    student_sd: 5                # sd of a student's own offset from their archetype's ability
    test_sd: 7                   # sd of one student's mark in one test
    teacher_points: 8            # added to every mark in the first teacher's tests
    skip_below: 35               # a mark below this percent may be skipped
    skip_chance: 0.9             # chance that a student with a mark below skip_below stays away
  small:                         # --small, for tests and quick looks
    weeks: 1
    students_per_section: 6
